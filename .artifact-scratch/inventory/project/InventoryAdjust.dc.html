<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inventory — stock adjustments</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
</style>
</helmet>
<div class="skin" style="width: 100%; min-height: 900px;">
<div class="wrap">

  <div class="top">
    <div>
      <h1>Inventory</h1>
      <p>Stock on hand, movements, adjustments, expiry and pricing — all in one place</p>
    </div>
  </div>

  <div class="tabs">
    <button type="button" aria-selected="false">Stock Overview</button>
    <button type="button" aria-selected="false">Stock Valuation</button>
    <button type="button" aria-selected="false">Movement History</button>
    <button type="button" aria-selected="true">Stock Adjustments</button>
    <button type="button" aria-selected="false">Expiry Tracking</button>
    <button type="button" aria-selected="false">Bulk Discounts</button>
  </div>

  <div class="card" style="max-width: 520px; padding: 20px;">
    <div class="f">
      <label for="adj_product">Product<span class="req">*</span></label>
      <select id="adj_product">
        <option>Select a product…</option>
        <option selected>Fanta Orange 50cl</option>
        <option>Omo Detergent 1kg</option>
      </select>
    </div>

    <div class="f">
      <label for="adj_batch">Batch<span class="req">*</span></label>
      <select id="adj_batch">
        <option>Select a batch…</option>
        <option selected>BATCH-0241 — 312 remaining (expires 2027-04-02)</option>
        <option>#318 — 24 remaining (expires 2026-12-05)</option>
      </select>
    </div>

    <div class="f">
      <label for="adj_type">Adjustment Type<span class="req">*</span></label>
      <select id="adj_type">
        <option>Correction — Add</option>
        <option selected>Correction — Remove</option>
        <option>Damaged</option>
        <option>Expired</option>
      </select>
    </div>

    <div class="f">
      <label for="adj_qty">Quantity<span class="req">*</span></label>
      <input id="adj_qty" type="text" value="6">
    </div>

    <div class="f" style="margin-bottom: 20px;">
      <label for="adj_reason">Reason<span class="req">*</span></label>
      <textarea id="adj_reason" rows="2">Recount — 6 short on the shelf</textarea>
    </div>

    <div style="display:flex; justify-content:flex-end;">
      <button type="button" class="btn p">Record Adjustment</button>
    </div>
  </div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1320,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
